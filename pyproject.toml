[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-model-comparison"
version = "0.1.0"
description = "Reproducible MNIST comparison of seven ML/DL models with Explainable AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "tensorflow>=2.20,<2.22",
  "matplotlib>=3.8,<4", "joblib>=1.3,<2", "pillow>=10,<13"
]

[project.optional-dependencies]
research = ["optuna>=4,<6", "pandas>=2.2,<3", "seaborn>=0.13,<0.14", "plotly>=5,<8", "tabulate>=0.9,<1", "jinja2>=3.1,<4"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5.10,<6"]
dev = ["build>=1.2,<2", "nbformat>=5.10,<6"]

[project.scripts]
mnist-project = "mnist_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
